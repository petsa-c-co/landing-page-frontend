server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # Este nginx vive DETRÁS del nginx del host, que es quien termina TLS.
  # Sin esta línea, al pedir /contacto (una carpeta prerenderizada) responde
  # "Location: http://127.0.0.1/contacto/": su propia dirección interna y en
  # http. El visitante termina en ninguna parte, o da una vuelta de más para
  # volver a https. Con absolute_redirect off la respuesta es "/contacto/",
  # relativa, y sirve con cualquier dominio y esquema de adelante.
  absolute_redirect off;

  # Sin esta línea el sitio se rompe al pegar un enlace directo o al recargar.
  # En el disco no existe ninguna carpeta "contacto": esa ruta solo existe dentro
  # de React. try_files busca el archivo, después la carpeta, y si no encuentra
  # ninguno entrega index.html para que React resuelva la ruta.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Los archivos que genera el build llevan un hash en el nombre
  # (index-DO7OfB_w.js). Si cambia el contenido cambia el nombre, así que se
  # pueden cachear para siempre sin riesgo de servir una versión vieja.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # NINGÚN html se cachea: son los que apuntan a los archivos con hash. Si el
  # navegador se queda con uno viejo, sigue pidiendo los archivos anteriores y
  # la persona no ve la versión nueva por más que hayas desplegado. Peor: esos
  # archivos ya no existen, así que la página queda en blanco hasta que alguien
  # recarga a mano.
  #
  # Va por expresión regular y no como `location = /index.html`: el
  # prerenderizado escribe una carpeta por ruta (contacto/index.html,
  # nosotros/index.html…) y esas quedaban fuera de la coincidencia exacta,
  # sirviéndose sin ninguna directiva de caché.
  location ~* \.html$ {
    add_header Cache-Control "no-cache";
  }

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;
}
